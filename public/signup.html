<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-6">📝 Create an Account</h1>

        <form id="signupForm" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium">Username</label>
                <input id="username" type="text" required
                    class="mt-1 block w-full px-3 py-2 rounded-lg text-black focus:outline-none" />
            </div>

            <div>
                <label for="displayName" class="block text-sm font-medium">Display Name</label>
                <input id="displayName" type="text" required
                    class="mt-1 block w-full px-3 py-2 rounded-lg text-black focus:outline-none" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium">Password</label>
                <input id="password" type="password" required
                    class="mt-1 block w-full px-3 py-2 rounded-lg text-black focus:outline-none" />
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-medium">
                Sign Up
            </button>
        </form>

        <p class="text-sm text-center text-gray-400 mt-4">
            Already have an account?
            <a href="/login.html" class="text-blue-400 hover:underline">Login here</a>
        </p>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const displayName = document.getElementById("displayName").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/api/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, displayName, password })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = "/";
                } else {
                    console.error(data);
                }
            } catch (err) {
                console.error("Signup failed", err);
            }
        });
    </script>
</body>

</html>
